<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaidify Collections</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #ff00ff; --bg: #08020f; }
        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        
        body { 
            background: var(--bg); 
            color: white; 
            font-family: 'Poppins', sans-serif; 
            overflow-x: hidden; 
            width: 100%;
        }

        /* --- FIXED MOBILE HEADER --- */
        nav { 
            width: 100%;
            padding: 12px 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #000; 
            position: fixed; /* Forced to stay at top */
            top: 0; 
            left: 0;
            z-index: 9999;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .logo-box { display: flex; align-items: center; gap: 8px; text-decoration: none; color: white; }
        .logo-img { height: 30px; width: auto; }
        .nav-brand { font-family: 'Bebas Neue'; font-size: 1.4rem; letter-spacing: 2px; }
        
        .order-btn-mobile { 
            background: var(--pink); 
            color: white; 
            text-decoration: none; 
            padding: 6px 12px; 
            border-radius: 4px; 
            font-size: 0.8rem; 
            font-weight: bold; 
            font-family: 'Bebas Neue';
            letter-spacing: 1px;
        }

        /* --- HERO SECTION (Adjusted for Fixed Nav) --- */
        .hero {
            height: 50vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-top: 60px; /* Space for the fixed nav */
        }
        .hero-logo { width: 80px; margin-bottom: 15px; filter: drop-shadow(0 0 10px var(--pink)); }
        .hero h1 { font-family: 'Bebas Neue'; font-size: clamp(2.5rem, 10vw, 5rem); letter-spacing: 5px; }

        /* --- PRODUCT WRAPPER --- */
        section { padding: 60px 5%; }
        .section-title { text-align: center; font-family: 'Bebas Neue'; font-size: 2.5rem; margin-bottom: 30px; }

        .p-wrapper { 
            max-width: 1000px; margin: 0 auto; background: rgba(255,255,255,0.03); 
            border-radius: 20px; display: flex; flex-wrap: wrap; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .p-img { flex: 1; min-width: 300px; height: 400px; }
        .p-img img { width: 100%; height: 100%; object-fit: cover; }
        
        .p-content { flex: 1.2; padding: 30px; min-width: 300px; }
        
        .s-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 15px 0; }
        .s-box { border: 1px solid rgba(255,255,255,0.3); padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
        .s-box.active { background: var(--pink); border-color: var(--pink); }

        .price-now { font-size: 2.8rem; font-weight: 900; color: white; }
        .wa-btn {
            display: block; background: #25d366; color: white; text-align: center;
            padding: 18px; border-radius: 12px; text-decoration: none;
            font-weight: 900; font-size: 1.1rem; margin-top: 15px;
        }

        /* --- DESKTOP TWEAKS --- */
        @media (min-width: 768px) {
            .nav-brand { font-size: 1.8rem; }
            .logo-img { height: 40px; }
            .hero-logo { width: 120px; }
            .order-btn-mobile { padding: 10px 20px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo-box">
            <img src="logo.png" class="logo-img" alt="Z">
            <span class="nav-brand">ZAIDIFY</span>
        </a>
        <a href="#women" class="order-btn-mobile">SHOP NOW</a>
    </nav>

    <header class="hero">
        <img src="logo.png" alt="Logo" class="hero-logo">
        <h1>ZAIDIFY</h1>
        <p style="opacity: 0.6; letter-spacing: 3px;">PREMIUM ETHNIC</p>
    </header>

    <section id="women">
        <h2 class="section-title">WOMEN'S COLLECTION</h2>
        <div class="p-wrapper">
            <div class="p-img"><img src="zw03-1.jpg" alt="Product"></div>
            <div class="p-content">
                <span style="color:var(--pink); font-weight:bold;">ZW03</span>
                <h2 style="margin: 5px 0;">Cotton Kurti Set</h2>
                
                <div class="s-row">
                    <div class="s-box" onclick="setSize(this, 'S')">S</div>
                    <div class="s-box" onclick="setSize(this, 'M')">M</div>
                    <div class="s-box" onclick="setSize(this, 'L')">L</div>
                    <div class="s-box" onclick="setSize(this, 'XL')">XL</div>
                </div>

                <div style="margin: 15px 0;">
                    <span class="price-now">₹558</span>
                    <span style="text-decoration:line-through; opacity:0.4; margin-left:10px;">₹1,199</span>
                </div>

                <a href="#" onclick="orderWA(event)" class="wa-btn">ORDER ON WHATSAPP</a>
            </div>
        </div>
    </section>

    <script>
        let selectedSize = "";
        function setSize(el, s) {
            document.querySelectorAll('.s-box').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            selectedSize = s;
        }
        function orderWA(e) {
            e.preventDefault();
            if(!selectedSize) { alert("Select a size!"); return; }
            window.open(`https://wa.me/918655171445?text=I want ZW03 Size ${selectedSize}`, '_blank');
        }
    </script>

</body>
</html>
